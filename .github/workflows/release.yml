# Builds the plugin and creates a draft GitHub release with the assets the
# Obsidian directory expects (main.js, manifest.json, styles.css) whenever a
# version tag is pushed. The tag must equal manifest.json's version, no "v"
# prefix: git tag -a 1.0.0 -m "1.0.0" && git push origin 1.0.0
# Review the draft on GitHub and publish it manually.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
